name: startup_toolkits
description: "Startup Toolkit: mini tools for founders in one app."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: any
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  in_app_purchase_storekit: ^0.4.15
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  integration_test:
    sdk: flutter
flutter:
  generate: true
  uses-material-design: true
